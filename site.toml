# =============================================================
#  RÉGLAGES GÉNÉRAUX DU SITE
#  Les projets, eux, viennent de Notion (dossier donnees/).
#
#  Règles d'écriture : un texte entre guillemets "…",
#  un texte long entre trois guillemets """…""" ;
#  une ligne vide sépare deux paragraphes.
# =============================================================

[site]
nom = "Anouck Blouin"
titre = "Anouck Blouin - Portfolio"
# Mot placé devant les noms de la colonne « Collaboration » du tableau
texte_collaboration = "Avec"
# Mention en bas de chaque page (mets "" pour l'enlever)
mention_ia = ""


# ---------- Page d'accueil ----------
# Affichée à l'arrivée sur le site et quand on clique sur ton nom.
# Pour ne pas avoir de page d'accueil, mets image = "".

[accueil]
onglet = "Accueil"       # texte du lien dans le menu
legende = ""

# La mosaïque : 9 photos, dans l'ordre (de gauche à droite, ligne par ligne).
# Elles apparaissent une par une à l'ouverture du site.
# - image       : le fichier dans le dossier images ;
# - projet      : laisse "". Le lien vers un projet se règle dans Notion, colonne « Mosaïque » :
#                 écris-y le nom du fichier de la photo (par exemple mosaique-1-pelouse.jpg).
#                 Une photo reliée à aucun projet mène à la page Projets.
#                 (Tu peux aussi écrire ici le nom d'un projet : il passe avant Notion.)
# - description : ce que montre la photo (lu par les personnes malvoyantes).
# Pour revenir à une seule image, supprime ces lignes et écris : image = "images/couverture.png"
mosaique = [
  { image = "images/mosaique-1-pelouse.jpg",     projet = "", description = "Un groupe assis sur une pelouse au soleil" },
  { image = "images/mosaique-2-reunion.jpg",     projet = "", description = "Une réunion de travail devant une grande carte aérienne" },
  { image = "images/mosaique-3-fanfare.jpg",     projet = "", description = "Une fanfare et une foule dans une rue" },
  { image = "images/mosaique-4-jardiniere.jpg",  projet = "", description = "Une jardinière de tulipes et de jacinthes" },
  { image = "images/mosaique-5-rue.jpg",         projet = "", description = "Un trottoir arboré bordé de commerces" },
  { image = "images/mosaique-6-structure.jpg",   projet = "", description = "Une structure métallique bleue sur un toit" },
  { image = "images/mosaique-7-enfants.jpg",     projet = "", description = "Des enfants en gilets jaunes dans une rue piétonne" },
  { image = "images/mosaique-8-chantier.jpg",    projet = "", description = "Une grue et une pièce de structure sur un chantier" },
  { image = "images/mosaique-9-cour.jpg",        projet = "", description = "Un groupe dans une cour entre des bâtiments blancs" },
]


# ---------- Page « A propos » ----------
# Pour ne pas afficher un élément, mets "" (par exemple telephone = "").

[a_propos]
onglet = "A propos"
photo = "images/photo-anouck.jpg"
telephone = "+33 6 10 43 35 26"
email = "anouck.blouin@yahoo.fr"
linkedin = "https://www.linkedin.com/in/anouck-blouin-3b9436202/"
cv = "documents/CV_Anouck_Blouin.pdf"
# Les bulles du schéma à droite du texte. Pour les réafficher, enlève les # devant les lignes.
thematiques = [
  # "Formes urbaines",
  # "Marchabilité",
  # "Aménagements pour la mobilité douce",
  # "Urbanisme favorable à la santé",
  # "Gestion des eaux",
  # "Réduction des îlots de chaleur",
]
texte = """
Ingénieure diplômée de l'EPFL en génie civil, climat et transformation des territoires, je souhaite agir pour l'aménagement de territoires durables. Au cœur de mes préoccupations : l'adaptation des territoires au changement climatique, mais aussi la transformation des villes au service du bien-être et de la santé des habitant·es. Une transformation juste et durable des territoires nécessite de prendre en compte les inégalités sociales, environnementales et d'accès aux services, notamment de santé.

Ma formation d'ingénieure généraliste en génie civil (structures, transports, hydraulique, géotechnique) me donne une base technique solide pour passer du diagnostic à la conception et la réalisation du projet.

Je crois en la force des données pour éclairer la décision publique, embarquer les habitant·es et prendre des décisions éclairées. La facilitation graphique est essentielle à la bonne compréhension des enjeux de transformation des territoires.

Nos territoires ont besoin d'ingénierie, de données et d'une approche systémique pour se transformer et offrir aux habitant·es un urbanisme qui favorise la bonne santé physique et mentale, avec des espaces publics créateurs de lien social de l'enfance au grand âge.
"""


# ---------- Page « Projets » ----------
# Tous les projets y sont affichés en cartes, dans l'ordre de la colonne « Ordre » de Notion.
[projets]
titre = "Projets"
tous = "Tous"
titre_une = "À la une"          # rangée des projets cochés « À la une » dans Notion
titre_autres = "Tous les projets"
cv_dans_menu = true      # ajoute « CV » dans le menu (false pour l'enlever)


# ---------- Domaines (filtres de la page Projets) ----------
# Chaque domaine est un bouton de filtre en haut de la page Projets.
# Un projet peut appartenir à plusieurs domaines (colonne « Catégorie » de Notion, en sélection multiple).
# Les compétences et méthodes, elles, sont dans la colonne « Tags » (étiquettes cliquables).
# - nom    : écrit EXACTEMENT comme l'option de la colonne « Catégorie » dans Notion ;
# - onglet : texte du bouton (facultatif, sinon on reprend le nom) ;
# - titre  : phrase affichée sous les filtres quand le domaine est sélectionné (facultatif).

[[categorie]]
nom = "Climat urbain et santé"

[[categorie]]
nom = "Mobilités"

[[categorie]]
nom = "Espaces publics"

[[categorie]]
nom = "Politiques publiques"


# ---------- Étiquettes ----------
[etiquettes]
# Afficher aussi la colonne « thèmes » de Notion (true) ou seulement « Tags » (false)
afficher_themes = false

# Couleur particulière pour certaines étiquettes (les autres sont saumon)
[etiquettes.couleurs]
"Publication" = "#2bb5a5"
